{% set name = "more-click" %}
{% set version = "0.1.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/more_click-{{ version }}.tar.gz
  sha256: c170987d37334278169fe3b9b388f1fcd9fc96439579354fd7c537537a182128

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.7
    - setuptools
    - wheel
    - pip
  run:
    - python >=3.7
    - click

test:
  imports:
    - more_click
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/cthoyt/more_click
  summary: More click.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - isuruf
    - dillonroach
